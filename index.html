<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Quizdown Converter</title>

  <script src="app/js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="app/css/base.css">
  <link rel="stylesheet" href="app/css/layout.css">
  <link rel="stylesheet" href="app/css/components.css">
  <link rel="stylesheet" href="app/css/builder.css">
  <link rel="stylesheet" href="app/css/responsive.css">
</head>
<body>
  <nav class="navbar">
    <a href="https://lateweb.github.io" class="back-link" style="font-size:13px; color:var(--text-muted); text-decoration:none; margin-right:16px;">&larr; Lateweb</a>
    <div class="brand">
      <h1>Quizdown Converter</h1>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <a href="help.html" target="_blank" rel="noopener noreferrer" class="help-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        Help
      </a>
    </div>
  </nav>

  <div class="main-container">
    <aside class="storage-sidebar" id="storageSidebar">
      <div class="sidebar-header">
        <h3>Library</h3>
        <span class="badge" id="savedCount">0</span>
      </div>
      <div class="saved-quizzes-container">
        <div class="search-container">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Search quizzes...">
        </div>
        <div id="savedQuizzesList">
          <div class="empty-state">No saved quizzes yet.</div>
        </div>
      </div>
      <div class="resize-handle" id="resizeHandle"></div>
    </aside>

    <main class="content-area">
      <div class="toolbar top-toolbar">
        <div class="left-group" style="display: flex; gap: 15px; align-items: center;">
          <div class="language-group">
            <label for="language-select">Interface:</label>
            <div class="select-wrapper">
              <select id="language-select">
                <option value="en">English</option>
                <option value="fi">Finnish</option>
              </select>
            </div>
          </div>
          <div class="exam-mode-toggle" style="display: flex; align-items: center; gap: 6px; margin-left: 10px; border-left: 1px solid var(--border-color); padding-left: 10px;">
            <input type="checkbox" id="examModeCheckbox" class="custom-checkbox">
            <label for="examModeCheckbox" style="margin:0; cursor: pointer; font-size: 0.85rem; user-select: none;">Exam Mode</label>
          </div>
        </div>

        <div class="primary-actions">
          <a href="editor.html" id="openBuilderBtn" class="btn btn-secondary" style="text-decoration: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            Visual Builder
          </a>
          <button id="saveBtn" class="btn btn-secondary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save
          </button>
          <button id="runBtn" class="btn btn-primary" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Generate HTML
          </button>
        </div>
      </div>

      <div class="editor-wrapper">
        <textarea id="quizdownCode" placeholder="Start typing your quiz here...
---
title: My Quiz
---
#Q
What is 2+2?
- [x] 4
- [ ] 5"></textarea>
      </div>

      <div class="toolbar bottom-toolbar">
        <div class="export-group">
          <span class="group-label">HTML Export</span>
          <button id="copyBtn" class="btn btn-sm">Copy Code</button>
          <button id="downloadBtn" class="btn btn-sm">Download .html</button>
        </div>

        <div class="export-separator"></div>

        <div class="export-group">
          <span class="group-label">LaTeX Export</span>
          <button id="copyBtnQ" class="btn btn-sm">Copy Q</button>
          <button id="copyBtnQA" class="btn btn-sm">Copy Q&amp;A</button>
          <button id="downloadBtnQ" class="btn btn-sm">DL Questions</button>
          <button id="downloadBtnQA" class="btn btn-sm">DL Q&amp;A</button>
          <div class="compact-mode-inline" style="display: flex; align-items: center; gap: 6px; margin-left: 8px; border-left: 1px solid var(--border-color); padding-left: 8px;">
            <input type="checkbox" id="compactMode" class="custom-checkbox">
            <label for="compactMode" style="margin:0; cursor: pointer; font-size: 0.85rem; user-select: none;">Compact (2-Column)</label>
          </div>
        </div>

        <div class="export-separator"></div>

        <div class="export-group">
          <span class="group-label">Share</span>
          <button id="share-quiz" class="btn btn-sm">Share Quiz</button>
          <input type="text" id="share-link" readonly placeholder="Shareable link will appear here">
          <button id="copy-share-link" class="btn btn-sm">Copy Link</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="app/js/quiz-parser.js"></script>
  <script src="app/js/html-generator.js"></script>
  <script src="app/js/latex-generator.js"></script>
  <script src="app/js/storage.js"></script>
  <script src="app/js/ui.js"></script>
</body>
</html>
